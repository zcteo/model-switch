[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-switch"
version = "0.5.0"
description = "Fetch models from one aggregated backend and switch Claude Code / Codex / Pi models locally"
requires-python = ">=3.8"
dependencies = ["tomli>=1.1.0; python_version < '3.11'"]

[project.scripts]
model-switch = "model_switch.cli:main"
ms = "model_switch.cli:main"

[tool.setuptools.packages.find]
include = ["model_switch*"]

# AGENTS.md 是各 agent 共享指令的唯一真源，必须随包分发。
[tool.setuptools.package-data]
model_switch = ["AGENTS.md"]
